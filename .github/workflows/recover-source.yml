name: Recover original handbook sources
on:
  push:
    paths: ['.github/workflows/recover-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'AIPMAndy/chinese-international-student-career-guide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve original public deliverables without executing them
        shell: python
        run: |
          import concurrent.futures, hashlib, json, pathlib, urllib.request, zipfile
          output = pathlib.Path('recovered')
          output.mkdir()
          sources = {
            'career': 'https://andy-student-career-guide.andyaipm.chatgpt.site/downloads/source-code.zip',
            'ai': 'https://andy-international-ai-jobs.andyaipm.chatgpt.site/downloads/chinese-international-student-ai-jobs-source.zip',
            'business': 'https://andy-business-jobs.andyaipm.chatgpt.site/downloads/repository-source.zip'
          }
          def retrieve(item):
              name, url = item
              result = {'project': name, 'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Andy-authorized-source-migration/1.0'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      data = response.read(30_000_001)
                      result.update(status=response.status, content_type=response.headers.get('Content-Type'), bytes=len(data))
                  if len(data) > 30_000_000 or not data.startswith(b'PK'):
                      raise ValueError('Response is not a ZIP archive within the size limit')
                  archive = output / (name + '.zip')
                  archive.write_bytes(data)
                  with zipfile.ZipFile(archive) as z:
                      result.update(sha256=hashlib.sha256(data).hexdigest(), entries=len(z.infolist()), paths=z.namelist()[:8])
                  result['ok'] = True
              except Exception as error:
                  result.update(ok=False, error=str(error))
              print(json.dumps(result, ensure_ascii=False), flush=True)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(retrieve, sources.items()))
          (output / 'recovery-report.json').write_text(json.dumps(results, ensure_ascii=False, indent=2))
      - name: Preserve recovered originals and recovery report
        uses: actions/upload-artifact@v4
        with:
          name: handbook-source-recovery
          path: recovered/
          retention-days: 3
