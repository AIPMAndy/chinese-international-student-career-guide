name: Verify original reviewed PDFs
on:
  push:
    paths: ['.github/workflows/recover-pdfs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'AIPMAndy/chinese-international-student-career-guide' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve original public PDFs
        shell: python
        run: |
          import concurrent.futures, hashlib, json, pathlib, urllib.request
          output = pathlib.Path('reviewed-pdfs'); output.mkdir()
          sources = {
            'career.pdf': 'https://andy-student-career-guide.andyaipm.chatgpt.site/downloads/chinese-international-student-career-guide.pdf',
            'business.pdf': 'https://andy-business-jobs.andyaipm.chatgpt.site/downloads/business-careers-guide.pdf'
          }
          def retrieve(item):
              name, url = item
              result = {'project': name, 'url': url}
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      data = response.read(10_000_001)
                  if len(data) > 10_000_000 or not data.startswith(b'%PDF-'):
                      raise ValueError('Invalid PDF response')
                  (output / name).write_bytes(data)
                  result.update(ok=True, bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
              except Exception as error:
                  result.update(ok=False, error=str(error))
              print(json.dumps(result), flush=True)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results = list(pool.map(retrieve, sources.items()))
          (output / 'report.json').write_text(json.dumps(results, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: original-reviewed-pdfs
          path: reviewed-pdfs/
          retention-days: 3
